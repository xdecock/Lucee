image: openjdk:11

before_script:
  - apt-get update
  - apt-get -y install ant maven

stages:
  - build

ci_build:
  stage: build
  script:
    - mvn -e -f loader/pom.xml clean install --settings travis-settings.xml -Dtestcases=false -Dversion=${CI_COMMIT_TAG};
  artifacts:
    paths:
      - loader/target/lucee-*.jar
    expire_in: 1 week
  only:
    - /^([0-9]+\.){3}[0-9]+\-patch[0-9]+$/